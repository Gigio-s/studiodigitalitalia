<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Onoranze Funebri Serafin">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe8db"/>
      <stop offset="0.55" stop-color="#e4dccc"/>
      <stop offset="1" stop-color="#d7cdb9"/>
    </linearGradient>
    <linearGradient id="cyp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4038"/>
      <stop offset="1" stop-color="#2c2823"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.55">
      <stop offset="0" stop-color="#f6efe2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f6efe2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- horizon land -->
  <path d="M0 600 Q300 572 600 588 T1200 596 L1200 800 L0 800 Z" fill="#cfc4ae" opacity="0.6"/>
  <path d="M0 648 Q360 624 700 640 T1200 648 L1200 800 L0 800 Z" fill="#bfb39a" opacity="0.55"/>

  <!-- cypress trees -->
  <g fill="url(#cyp)">
    <path d="M600 150 C560 320 566 470 578 596 L622 596 C634 470 640 320 600 150 Z"/>
    <path d="M470 300 C446 402 450 500 458 596 L502 596 C510 500 514 402 490 300 Z" opacity="0.9"/>
    <path d="M726 300 C702 402 706 500 714 596 L758 596 C766 500 770 402 746 300 Z" opacity="0.9"/>
  </g>
  <!-- trunks -->
  <g fill="#2c2823" opacity="0.85">
    <rect x="594" y="592" width="12" height="20"/>
    <rect x="478" y="592" width="10" height="16"/>
    <rect x="734" y="592" width="10" height="16"/>
  </g>

  <!-- gentle flame above central cypress -->
  <path d="M600 120 C588 138 586 154 600 166 C614 154 612 138 600 120 Z" fill="#b08d57"/>

  <!-- bottom soft vignette for legibility of overlaid text -->
  <rect x="0" y="620" width="1200" height="180" fill="#2c2823" opacity="0.12"/>
</svg>
