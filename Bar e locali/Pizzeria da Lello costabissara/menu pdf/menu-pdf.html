<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<base href="../demo-sito/">
<title>Menu Pizzeria da Lello Le Fornaci</title>
<!-- Sorgente del PDF del menu (formato telefono 100 x 178 mm).
     Dati presi da assets/js/menu-data.js: cambiando i prezzi li si rigenera il PDF. -->
<style>
@font-face{font-family:'FSC';src:url(assets/fonts/fsc-300.woff2);font-weight:300}
@font-face{font-family:'FSC';src:url(assets/fonts/fsc-400.woff2);font-weight:400}
@font-face{font-family:'FSC';src:url(assets/fonts/fsc-700.woff2);font-weight:700}
@font-face{font-family:'FSC';src:url(assets/fonts/fsc-800.woff2);font-weight:800}
@font-face{font-family:'FSEC';src:url(assets/fonts/fsec-300.woff2);font-weight:300}
@font-face{font-family:'FSEC';src:url(assets/fonts/fsec-600.woff2);font-weight:600}
@font-face{font-family:'FSEC';src:url(assets/fonts/fsec-800.woff2);font-weight:800}
@font-face{font-family:'FSEC';src:url(assets/fonts/fsec-900.woff2);font-weight:900}
@font-face{font-family:'Mano';src:url(assets/fonts/caveat-600.woff2);font-weight:600}
@page{size:100mm 178mm;margin:4mm 0 5mm}
@page full{size:100mm 178mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:400 10pt/1.3 'FSC',sans-serif;color:#1d1a1b;-webkit-print-color-adjust:exact;print-color-adjust:exact}
a{color:inherit;text-decoration:none}
.pg{width:100mm;position:relative;break-after:page;overflow:hidden}
.flow{break-after:auto}

/* copertina */
.cover{page:full;height:178mm;background:#F0C419;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12mm 8mm}
.cover .firma{width:72mm}
.cover .lf{font:300 17pt/1 'FSEC';letter-spacing:.14em;text-transform:uppercase;margin-top:3mm}
.cover .lf b{font-weight:900}
.cover .tag{margin-top:6mm;font:600 18pt/1.05 'Mano';color:#1d1a1b}
.cover .prem{margin-top:9mm;padding:2.6mm 5mm;border:.5mm solid #1d1a1b;border-radius:20mm;font:800 8.5pt/1.2 'FSEC';letter-spacing:.08em;text-transform:uppercase}
.cover .logo{width:40mm;margin-top:12mm}
.cover .addr{margin-top:4mm;font:400 8.5pt/1.4 'FSC'}

/* indice */
.idx{padding:3mm 7mm 0}
.idx h1{margin:0 0 1mm;font:300 20pt/1 'FSEC';text-transform:uppercase}
.idx h1 b{font-weight:900}
.idx .hint{margin:0 0 4.5mm;font:600 12pt/1.1 'Mano';color:#6b6b6b}
.idx a{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.7mm;padding:2.4mm 4mm;border-radius:3mm;background:var(--c);color:#fff;font:300 13pt/1 'FSEC';text-transform:uppercase}
.idx a b{font-weight:900}
.idx a i{font-style:normal;font:800 12pt/1 'FSEC'}
.idx .ex{display:flex;flex-wrap:wrap;gap:1.2mm;margin-top:3mm}
.idx .ex span{padding:1.4mm 2.6mm;border-radius:5mm;background:#F6F1DF;font:600 7.6pt/1 'FSEC';letter-spacing:.03em}

/* sezioni */
.sec{break-before:page;padding-bottom:0}
.sec.cont{break-before:auto;margin-top:5mm}
.band{display:flex;align-items:center;justify-content:space-between;padding:4.2mm 6mm 3.6mm;background:var(--c);color:#fff;font:300 17pt/1 'FSEC';text-transform:uppercase}
.band b{font-weight:900}
.band a{font:600 7.5pt/1 'FSEC';letter-spacing:.08em;padding:1.4mm 2.4mm;border:.3mm solid currentColor;border-radius:4mm;white-space:nowrap}
.pill{margin:3mm 5mm 1mm;padding:2.2mm 3.4mm;border:.5mm solid var(--c);border-radius:5mm;font:400 8.6pt/1.32 'FSC';text-align:center}
.pill b{font-weight:800;text-transform:uppercase;color:var(--ink)}
.note{margin:2.6mm 6mm 0;font:400 8.2pt/1.3 'FSC';font-style:italic;color:#555}
.list{padding:.5mm 6mm 0}
.sh{margin:4mm 0 .5mm;padding-bottom:1.1mm;border-bottom:.5mm solid var(--c);font:800 9pt/1.1 'FSEC';letter-spacing:.08em;text-transform:uppercase;color:var(--ink);break-after:avoid}
.it{display:grid;grid-template-columns:1fr auto;gap:.4mm 3mm;align-items:baseline;padding:1.9mm 0;border-bottom:.25mm dotted #bdbdbd;break-inside:avoid}
.it.ph{padding:1.4mm 0;grid-template-columns:11.5mm 1fr auto;align-items:center}
.it img{width:11.5mm;height:11.5mm;object-fit:contain}
.n{display:block;font:800 11pt/1.1 'FSEC';text-transform:uppercase;color:var(--ink)}
.d{display:block;margin-top:.6mm;font:400 9pt/1.28 'FSC'}
.p{font:800 11pt/1.1 'FSEC';white-space:nowrap;text-align:right}
.it.ph .p{align-self:center}
.end{page:full;break-before:page;height:178mm;background:#4F7FA0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10mm}
.end .firma{width:56mm;filter:brightness(0) invert(1)}
.end p{margin:2mm 0;font:400 10pt/1.45 'FSC'}
.end .big{font:800 15pt/1.1 'FSEC';letter-spacing:.04em}
.end .btn{display:inline-block;margin-top:4mm;padding:2.6mm 5mm;border-radius:6mm;background:#fff;color:#1d1a1b;font:800 10pt/1 'FSEC';letter-spacing:.06em;text-transform:uppercase}
.end small{display:block;margin-top:8mm;font:400 7.5pt/1.4 'FSC';opacity:.85}
</style>
</head>
<body>
<div id="out"></div>
<script src="assets/js/menu-data.js"></script>
<script>
(function(){
var M=window.LELLO_MENU, P={}; (window.LELLO_PIZZE||[]).forEach(function(p){P[p.id]=p;});
var CONT={piccoli:1,aperitivi:1};
function pr(v){ return typeof v==='number' ? v.toFixed(2).replace('.',',') : (v||''); }
var h='';
h+='<section class="pg cover" id="top"><img class="firma" src="assets/img/dalello-firma.png" alt="da Lello">'+
  '<div class="lf">Le <b>Fornaci</b></div><div class="tag">la vera pizza napoletana<br>dal 1997</div>'+
  '<div class="prem">Migliore pizzeria di Vicenza 2024</div>'+
  '<img class="logo" src="assets/img/lello-logo-scuro.png" alt="">'+
  '<div class="addr">Via Fornace 19, Costabissara (VI)<br>Tel. 0444 557751</div></section>';
h+='<section class="pg idx" id="indice"><h1>Il <b>menu</b></h1><p class="hint">tocca una sezione per andarci</p>'+
  M.map(function(g){ return '<a href="#'+g.id+'" style="--c:'+g.col+(g.fg?';color:'+g.fg:'')+'"><span>'+g.t1+' <b>'+g.t2+'</b></span><i>›</i></a>'; }).join('')+
  '<div class="ex">'+(window.LELLO_EXTRA||[]).map(function(x){return '<span>'+x+'</span>';}).join('')+'</div></section>';
h+='<div class="flow">'+M.map(function(g){
  var rows=g.voci.map(function(v){
    if(v[0]==='§') return '<h3 class="sh">'+v[1]+'</h3>';
    var p=v[3]&&P[v[3]];
    return '<div class="it'+(p?' ph':'')+'">'+(p?'<img src="assets/img/menu-pdf/'+p.id+'.jpg" alt="">':'')+
      '<div><b class="n">'+v[0]+'</b>'+(v[2]?'<span class="d">'+v[2]+'</span>':'')+'</div><span class="p">'+pr(v[1])+'</span></div>';
  }).join('');
  return '<section class="sec'+(CONT[g.id]?' cont':'')+'" id="'+g.id+'" style="--c:'+g.col+';--ink:'+g.ink+'">'+
    '<h2 class="band"'+(g.fg?' style="color:'+g.fg+'"':'')+'><span>'+g.t1+' <b>'+g.t2+'</b></span><a href="#indice">indice</a></h2>'+
    (g.pill?'<p class="pill">'+g.pill+'</p>':'')+(g.nota?'<p class="note">'+g.nota+'</p>':'')+'<div class="list">'+rows+'</div></section>';
}).join('')+'</div>';
h+='<section class="end"><img class="firma" src="assets/img/dalello-firma.png" alt="">'+
  '<p class="big">Prenota il tuo tavolo</p><p>Via Fornace 19, Costabissara (VI)<br>Tel. 0444 557751</p>'+
  '<a class="btn" href="https://www.octotable.com/book/restaurant/420578/welcome">Prenota online</a>'+
  '<p>Instagram @lefornacidalello</p>'+
  '<small>Prezzi in euro. Alcuni prodotti possono essere surgelati.<br>Allergeni: chiedi al personale la tabella dei 14 allergeni.</small></section>';
document.getElementById('out').innerHTML=h;
})();
</script>
</body>
</html>
