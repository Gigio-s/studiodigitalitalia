<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu | Pizzeria da Lello Le Fornaci, Costabissara</title>
<meta name="description" content="Il menu della Pizzeria da Lello Le Fornaci: pizze napoletane classiche ed eccellenze, calzoni, pizze sottili, fritti, insalatone e bevande, con prezzi e ingredienti.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#231F20">
<link rel="icon" href="https://www.pizzeriadalello.it/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="preload" href="../assets/fonts/fsec-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="menu">
<div id="site-header"></div>

<main id="main">
  <section class="hero menu-hero" aria-label="Le nostre pizze">
    <div class="hero-head">
      <span class="eyebrow">Il menu</span>
      <h1>Le nostre <em>pizze</em></h1>
      <span class="hint"><i></i>Scorri e tocca una pizza per vedere gli ingredienti</span>
    </div>
    <div class="wheel" data-wheel></div>
  </section>

  <section class="mu-wrap" id="menu" aria-label="Menu completo">
    <!-- VERSIONE DEL MENU
         data-stile="ufficiale" = menu in stile cartaceo (carta bianca, fasce colorate)
         data-stile="sito"      = menu integrato nella pagina (prima versione della demo)
         data-selettore="si"    = mostra i pulsanti per passare da una versione all'altra, "no" li nasconde -->
    <div id="menu-app" data-stile="ufficiale" data-selettore="si"></div>
  </section>

  <section class="sec dark center">
    <div class="wrap">
      <h2 class="h2">Hai già scelto? <em>Ti aspettiamo.</em></h2>
      <div style="margin-top:28px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><a class="btn btn-red" href="https://www.octotable.com/book/restaurant/420578/welcome" target="_blank" rel="noopener">Prenota un tavolo</a><a class="btn btn-ghost" href="tel:+390444557751">Chiama 0444 557751</a></div>
      <p style="margin-top:26px;font-size:13px;color:var(--grigio)">Allergeni: chiedi al personale la tabella dei 14 allergeni. Alcuni prodotti possono essere surgelati.</p>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="js/menu-data.js"></script>
<script src="js/pizza-wheel.js"></script>
<script src="js/main.js"></script>
<script src="../assets/js/versioni.js" data-v="3"></script>
</body>
</html>
